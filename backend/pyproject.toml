[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.11.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",  # required by fastapi.testclient.TestClient
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "auto" lets async tests run without an explicit @pytest.mark.asyncio marker.
asyncio_mode = "auto"
# Import `main` and `src` from the backend/ project root.
pythonpath = ["."]
